{%- comment -%}
  Events for the timeline view (assets/js/timeline.js).
  Posts come from _posts, with the English title from _translations when there is one;
  the other tracks come from _data/timeline.yml.
{%- endcomment -%}
<script type="application/json" id="timeline-data">{"posts":[{% for post in site.posts %}{% assign tl_key = post.path | split: "/" | last %}{% assign tl_en = site.translations | where_exp: "t", "t.path contains tl_key" | first %}{"date":{{ post.date | date: "%Y-%m-%d" | jsonify }},"en":{{ tl_en.title | default: post.title | jsonify }},"zh":{{ post.title | jsonify }},"url":{{ post.url | relative_url | jsonify }},"desc":{{ post.description | default: "" | jsonify }},"desc_en":{{ tl_en.description | default: post.description | default: "" | jsonify }},"desc_zh":{{ post.description | default: "" | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}],"tracks":{{ site.data.timeline.tracks | jsonify }},"horizon":{{ site.data.timeline.horizon | jsonify }},"future_years":{{ site.data.timeline.future_years | default: 3 | jsonify }},"now_items":{{ site.data.timeline.now_items | jsonify }}}</script>
