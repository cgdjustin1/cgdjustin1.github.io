{%- comment -%}
  Events for the timeline view (assets/js/timeline.js).
  Posts come from _posts; the other tracks come from _data/timeline.yml.
{%- endcomment -%}
<script type="application/json" id="timeline-data">{"posts":[{% for post in site.posts %}{"date":{{ post.date | date: "%Y-%m-%d" | jsonify }},"en":{{ post.title | jsonify }},"zh":{{ post.title | jsonify }},"url":{{ post.url | relative_url | jsonify }},"desc":{{ post.description | default: "" | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}],"tracks":{{ site.data.timeline.tracks | jsonify }},"horizon":{{ site.data.timeline.horizon | jsonify }},"future_years":{{ site.data.timeline.future_years | default: 3 | jsonify }},"now_items":{{ site.data.timeline.now_items | jsonify }}}</script>
