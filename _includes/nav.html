<header class="site-header">
  <h1>
    <a href="/">Justin Chen</a>
  </h1>
  <nav>
    <a href="/blog/"{% if page.url contains '/blog' or page.layout == 'post' %} class="active"{% endif %}><span data-i18n="en">Blog</span><span data-i18n="zh">博客</span></a>
    <a href="/questions/"{% if page.url contains '/questions' %} class="active"{% endif %}><span data-i18n="en">Questions</span><span data-i18n="zh">问题</span></a>
    <a href="/projects/"{% if page.url contains '/projects' %} class="active"{% endif %}><span data-i18n="en">Projects</span><span data-i18n="zh">项目</span></a>
    <a href="/about/"{% if page.url contains '/about' %} class="active"{% endif %}><span data-i18n="en">About</span><span data-i18n="zh">关于</span></a>
    <button class="lang-toggle" type="button" aria-label="Switch language / 切换语言"><span data-i18n="en" lang="zh">中文</span><span data-i18n="zh" lang="en">EN</span></button>
    <button class="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3.5a8.5 8.5 0 0 0 0 17z" fill="currentColor"/></svg>
    </button>
  </nav>
</header>
