title: Justin Chen
description: Builder — AI systems that institutions trust with consequential decisions
url: "https://cgdjustin.xyz"
baseurl: ""
markdown: kramdown
permalink: pretty
plugins:
  - jekyll-feed
# English versions of posts: _translations/<same file name as the post>.md (sync-blog.sh never touches them)
collections:
