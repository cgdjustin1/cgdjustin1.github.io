<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
  <script>
    // Apply the saved theme and language before first paint so the page never flashes the wrong colors or language
    (function () {
      var root = document.documentElement;
      try {
        var theme = localStorage.getItem('theme');
        if (theme === 'light' || theme === 'dark') root.setAttribute('data-theme', theme);
      } catch (e) {}
      var lang = null;
      try { lang = localStorage.getItem('lang'); } catch (e) {}
      if (lang !== 'en' && lang !== 'zh') {
        // First visit: follow the browser's preferred language
        var preferred = (navigator.languages && navigator.languages[0]) || navigator.language || '';
        lang = /^zh/i.test(preferred) ? 'zh' : 'en';
      }
      root.setAttribute('data-lang', lang);
    })();
  </script>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="robots" content="index, follow">

  <!-- Open Graph -->
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">

  <title>{{ page.title | default: site.title }}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Non-blocking, so pages render at once with system fonts where Google Fonts is slow or unreachable -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" type="image/png" href="{{ '/assets/favicon/favicon-96x96.png' | relative_url }}">
  <link rel="shortcut icon" href="{{ '/assets/favicon/favicon.ico' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/favicon/apple-touch-icon.png' | relative_url }}">
  <link rel="manifest" href="{{ '/assets/favicon/site.webmanifest' | relative_url }}">
  {% feed_meta %}
</head>

<body>
  {% include nav.html %}

  {{ content }}

  {% include footer.html %}
  {% include timeline-data.html %}
  <script src="{{ '/assets/js/timeline.js' | relative_url }}" defer></script>
  <script>
    (function () {
      var button = document.querySelector('.theme-toggle');
      if (!button) return;
      var root = document.documentElement;
      var systemDark = window.matchMedia('(prefers-color-scheme: dark)');
      function current() {
        return root.getAttribute('data-theme') || (systemDark.matches ? 'dark' : 'light');
      }
      function sync() {
        var dark = current() === 'dark';
        button.setAttribute('aria-pressed', String(dark));
        button.setAttribute('title', dark ? 'Switch to light mode' : 'Switch to dark mode');
      }
      button.addEventListener('click', function () {
        var next = current() === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
        sync();
      });
      if (systemDark.addEventListener) systemDark.addEventListener('change', sync);
      sync();
    })();

    (function () {
      var root = document.documentElement;
      // Tag each translated piece with its language, so fonts, screen readers and translation tools read it correctly
      var pieces = document.querySelectorAll('[data-i18n]:not([lang])');
      for (var i = 0; i < pieces.length; i++) pieces[i].setAttribute('lang', pieces[i].getAttribute('data-i18n'));
      var button = document.querySelector('.lang-toggle');
      if (!button) return;
      function sync() {
        button.setAttribute('title', root.getAttribute('data-lang') === 'zh' ? 'Switch to English' : '切换到中文');
      }
      button.addEventListener('click', function () {
        var next = root.getAttribute('data-lang') === 'zh' ? 'en' : 'zh';
        root.setAttribute('data-lang', next);
        try { localStorage.setItem('lang', next); } catch (e) {}
        sync();
      });
      sync();
    })();
  </script>
</body>
</html>
